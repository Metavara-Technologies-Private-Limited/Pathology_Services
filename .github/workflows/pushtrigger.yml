
name: Pathology Backend pushtrigger

on:
  push:
    branches:
      - dev
      - main
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # -------- Checkout --------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------- Docker setup --------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -------- Login to Docker Hub --------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -------- Build Docker image --------
      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t ${{ secrets.DOCKER_USERNAME }}/pathology-backend:${{ github.run_number }} \
            -t ${{ secrets.DOCKER_USERNAME }}/pathology-backend:stable \
            .

      # -------- Push Docker images --------
      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/pathology-backend:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/pathology-backend:stable

      # -------- Deploy to VPS --------
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/apps/pathology

            # Pull latest backend image
            docker compose pull backend

            # Restart backend container
            docker compose up -d backend

