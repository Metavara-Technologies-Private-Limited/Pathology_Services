name: Pathology Backend Push Trigger

on:
  push:
    branches:
      #- dev
      #- main
      #- staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ---------- Checkout ----------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Docker setup ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- Docker login ----------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ---------- Build image ----------
      - name: Build Docker image
        run: |
          docker build --no-cache \
            -f devops/Dockerfile \
            -t ${{ secrets.DOCKER_USERNAME }}/pathology-backend:${{ github.run_number }} \
            .

      # ---------- Stable tag ----------
      - name: Tag stable image
        run: |
          docker tag ${{ secrets.DOCKER_USERNAME }}/pathology-backend:${{ github.run_number }} \
                     ${{ secrets.DOCKER_USERNAME }}/pathology-backend:stable

      # ---------- Push ----------
      - name: Push images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/pathology-backend:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/pathology-backend:stable

      # ---------- Deploy ----------
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            cd /opt/apps/pathology

            docker compose pull backend

            docker compose up -d --force-recreate backend

            sleep 10

            docker ps | grep pathology-backend

            docker exec pathology-backend python manage.py migrate || true
